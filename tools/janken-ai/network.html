<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101719">
  <title>神経回路 3D | じゃんけんラボ</title>
  <link rel="stylesheet" href="network.css?v=20261126-2">
  <script src="model.js" defer></script>
  <script src="adaptive-features.js?v=20261117-4" defer></script>
  <script src="model-runtime.js?v=20261126-2" defer></script>
  <script src="play-policy.js" defer></script>
  <script src="opponent-model.js?v=20261126-2" defer></script>
  <script src="engine.js" defer></script>
  <script src="play.js?v=20261126-2" defer></script>
  <script src="network.js?v=20261126-2" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <a href="./">← じゃんけんラボ</a>
      <a href="play.html">シンプル対戦 ↗</a>
    </header>
    <h1>神経回路 <em>3D</em></h1>
    <div class="studio">
      <section class="viewer" aria-label="神経回路の可視化">
        <div class="orb">
          <canvas id="network-canvas" tabindex="0" aria-label="神経回路の3D表示" aria-describedby="gesture"></canvas>
          <span class="orb-label top">出力</span>
          <span class="orb-label bottom">入力</span>
        </div>
        <div class="viewer-actions">
          <button id="network-pause" type="button" aria-pressed="false">動きを止める</button>
          <button id="network-reset" type="button">視点を戻す</button>
        </div>
        <p id="gesture" class="hint">ドラッグか矢印キーで回転</p>
        <p class="legend"><span>● 正の重み</span><span>● 負の重み</span><span>● 信号の強さ</span></p>
      </section>
      <section class="panel" aria-label="AI対戦">
        <h2>AIと対戦</h2>
        <div class="results" aria-live="polite" aria-atomic="true">
          <span>AIの手 <strong id="opponent-move">—</strong></span>
          <strong id="outcome">—</strong>
        </div>
        <div class="hands" aria-label="出す手">
          <button type="button" data-move="rock"><span aria-hidden="true">✊</span>グー</button>
          <button type="button" data-move="paper"><span aria-hidden="true">✋</span>パー</button>
          <button type="button" data-move="scissors"><span aria-hidden="true">✌️</span>チョキ</button>
        </div>
        <div class="inspection">
          <h2>ネットワーク</h2>
          <div id="branch-list" class="branch-list" role="group" aria-label="表示するネットワーク"></div>
          <p id="network-shape" class="hint"></p>
          <p id="network-status" class="status">手を出すと、その対戦の信号が流れます。</p>
          <div id="network-probs" class="probabilities" aria-label="選択中のネットワークが予測したあなたの手" hidden></div>
          <p id="network-decision" class="hint" hidden></p>
          <p class="hint">重みの絶対値が大きい結線を表示します。信号はあなたが出した手に対する、対戦直前の計算です。</p>
        </div>
        <details id="network-planning" class="inspection planning" hidden>
          <summary id="network-planning-title">読み先の評価</summary>
          <table>
            <thead><tr><th scope="col">候補</th><th scope="col">直近</th><th scope="col">読み先</th><th scope="col">合計点</th></tr></thead>
            <tbody id="network-planning-scores"></tbody>
          </table>
          <p id="network-planning-hint" class="hint"></p>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
