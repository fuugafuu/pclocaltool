<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIとじゃんけん</title>
  <link rel="stylesheet" href="play.css">
  <script src="model.js" defer></script>
  <script src="adaptive-features.js?v=20261117-4" defer></script>
  <script src="model-runtime.js?v=20261118-1" defer></script>
  <script src="play-policy.js" defer></script>
  <script src="engine.js" defer></script>
  <script src="play.js" defer></script>
</head>
<body>
  <main aria-label="AIとじゃんけん">
    <section class="result" aria-live="polite" aria-atomic="true">
      <div id="opponent" class="opponent">AIの手 <span id="opponent-move">—</span></div>
      <p id="outcome" class="outcome">—</p>
    </section>
    <div class="hands" aria-label="出す手">
      <button type="button" data-move="rock"><span aria-hidden="true">✊</span>グー</button>
      <button type="button" data-move="paper"><span aria-hidden="true">✋</span>パー</button>
      <button type="button" data-move="scissors"><span aria-hidden="true">✌️</span>チョキ</button>
    </div>
  </main>
</body>
</html>
