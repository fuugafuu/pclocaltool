<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Arcade Lab | PC Local Tool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">
    <div class="logo">RA</div>
    <div><h1>Retro Arcade Lab</h1><p>昔の手触りを残した、拡張型ブラウザゲームセンター</p></div>
  </div>
  <div class="top-actions">
    <span id="game-count" class="pill">0 GAMES</span>
    <button id="theme-toggle" class="icon-btn">☀️</button>
  </div>
</header>

<section class="hero">
  <div>
    <div class="eyebrow">CLASSIC CORE · MODERN COMFORT</div>
    <h2>100本まで増やせるゲーム基盤</h2>
    <p>各ゲームは独立登録。クラシック表示と現代アシストを切り替え、ハイスコアや設定はローカル保存。</p>
  </div>
  <div class="hero-stats">
    <div><b id="played-count">0</b><span>プレイ済み</span></div>
    <div><b id="favorite-count">0</b><span>お気に入り</span></div>
    <div><b id="highscore-count">0</b><span>記録あり</span></div>
  </div>
</section>

<section class="toolbar">
  <div class="search-wrap"><span>⌕</span><input id="search" placeholder="ゲーム名・年代・ジャンルで検索"></div>
  <select id="genre-filter"><option value="">すべてのジャンル</option></select>
  <select id="era-filter"><option value="">すべての年代</option><option value="1970">1970年代</option><option value="1980">1980年代</option><option value="1990">1990年代</option></select>
  <button id="favorites-only" class="secondary">☆ お気に入り</button>
</section>

<main>
  <div id="game-grid" class="game-grid"></div>
</main>

<footer>
  <span>完全ローカル動作 · 外部CDN/APIなし</span>
  <a href="ADD_GAME.md">ゲーム追加仕様</a>
</footer>
</div>

<div id="overlay" class="overlay hidden">
  <section class="cabinet">
    <header class="cabinet-head">
      <div><div id="game-era" class="eyebrow"></div><h2 id="game-title">GAME</h2><p id="game-subtitle"></p></div>
      <div class="cabinet-actions"><button id="favorite-game" class="icon-btn">☆</button><button id="close-game" class="icon-btn">✕</button></div>
    </header>
    <div class="game-controls">
      <div class="segmented"><button data-play-mode="classic" class="active">CLASSIC</button><button data-play-mode="modern">MODERN</button></div>
      <button id="restart-game">↻ RESTART</button>
      <button id="pause-game">Ⅱ PAUSE</button>
      <button id="sound-toggle">♪ SOUND</button>
      <div class="scorebox"><span>SCORE</span><b id="score">000000</b></div>
      <div class="scorebox"><span>HI</span><b id="highscore">000000</b></div>
    </div>
    <div class="screen-wrap">
      <div class="screen-bezel">
        <div id="game-host" class="game-host"></div>
        <div class="scanlines"></div>
        <div class="screen-glow"></div>
      </div>
      <aside class="game-info">
        <div class="info-block"><span>ORIGINAL</span><b id="classic-info"></b></div>
        <div class="info-block"><span>MODERN</span><b id="modern-info"></b></div>
        <div class="info-block"><span>CONTROLS</span><b id="control-info"></b></div>
        <div id="status-info" class="status-info"></div>
      </aside>
    </div>
    <div id="touch-controls" class="touch-controls">
      <div class="dpad"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></div>
      <div class="action-pad"><button data-key="KeyZ">A</button><button data-key="KeyX">B</button><button data-key="Space">●</button></div>
    </div>
  </section>
</div>

<script src="core.js"></script>
<script src="games/catalog.js"></script>
<script src="games/classics-a.js"></script>
<script src="games/classics-b.js"></script>
<script>RetroArcade.boot();</script>
</body>
</html>
